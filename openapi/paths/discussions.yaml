/discuss:
  get:
    tags: [讨论]
    summary: 列出帖子
    parameters:
      - name: forum
        in: query
        schema: { type: string }
      - $ref: '../openapi.yaml#/components/parameters/Page'
    responses:
      "200":
        description: 帖子列表
        content:
          application/json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/LentilleDataResponse'

/api/user/createdPosts:
  get:
    tags: [讨论]
    summary: 列出发布的帖子
    parameters:
      - $ref: '../openapi.yaml#/components/parameters/Page'
      - name: orderBy
        in: query
        schema: { type: string }
    responses:
      "200":
        description: 发布的帖子列表
        content:
          application/json:
            schema:
              type: object
              properties:
                posts:
                  type: array
                  items: {}

/discuss/{id}:
  get:
    tags: [讨论]
    summary: 获取帖子
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer }
      - $ref: '../openapi.yaml#/components/parameters/Page'
      - name: sort
        in: query
        schema: { type: string }
    responses:
      "200":
        description: 帖子详情
        content:
          application/json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/LentilleDataResponse'

/api/discuss/post:
  post:
    tags: [讨论]
    summary: 发布帖子
    requestBody:
      content:
        application/json:
          schema:
            $ref: '../openapi.yaml#/components/schemas/CreatePostRequest'
    responses:
      "200":
        description: 发布成功
        content:
          application/json:
            schema:
              type: object
              properties:
                status: { type: integer }
                data: { type: integer }

/api/discuss/reply/{id}:
  post:
    tags: [讨论]
    summary: 发表回复
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer }
    requestBody:
      content:
        application/json:
          schema:
            type: object
            required: [captcha, content]
            properties:
              captcha: { type: string }
              content: { type: string }
    responses:
      "200":
        description: 回复成功
        content:
          application/json:
            schema:
              type: object
              properties:
                status: { type: integer }
                data: { type: array, items: {} }

/api/discuss/delete/{id}:
  delete:
    tags: [讨论]
    summary: 删除帖子
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer }
    responses:
      "200":
        description: 删除成功
        content:
          application/json:
            schema:
              type: object
              properties:
                status: { type: integer }
                data: { type: array, items: {} }

/api/discuss/deleteReply/{id}:
  delete:
    tags: [讨论]
    summary: 删除回复
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer }
    responses:
      "200":
        description: 删除成功
        content:
          application/json:
            schema:
              type: object
              properties:
                status: { type: integer }
                data: { type: array, items: {} }

/api/report/post:
  post:
    tags: [讨论]
    summary: 举报帖子
    requestBody:
      content:
        application/json:
          schema:
            type: object
            required: [relevantID, reason]
            properties:
              relevantID: { type: integer }
              reason: { type: string }
    responses:
      "200":
        description: 举报成功
        content:
          application/json:
            schema:
              type: object
              properties:
                status: { type: integer }
                data: { type: string }

/api/report/post_reply:
  post:
    tags: [讨论]
    summary: 举报回复
    requestBody:
      content:
        application/json:
          schema:
            type: object
            required: [relevantID, reason]
            properties:
              relevantID: { type: integer }
              reason: { type: string }
    responses:
      "200":
        description: 举报成功
        content:
          application/json:
            schema:
              type: object
              properties:
                status: { type: integer }
                data: { type: string }
